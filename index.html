<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1b22">
<title>Смешные картинки</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#1b1b22;color:#eee}
header{text-align:center;padding:24px 16px;font-size:1.8em;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:16px;max-width:1200px;margin:0 auto}
.cell{position:relative;cursor:pointer;border-radius:10px;overflow:hidden;background:#000;transition:transform .15s}
.cell:hover{transform:scale(1.02)}
.cell img,.cell video{width:100%;display:block;pointer-events:none}
.cell video{aspect-ratio:16/9;object-fit:cover}
.play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid #fff;display:grid;place-items:center;pointer-events:none}
.play:after{content:"";margin-left:5px;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);font-size:12px;padding:2px 6px;border-radius:4px}
#st{text-align:center;padding:30px;opacity:.7}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);align-items:center;justify-content:center;z-index:10}
#lb.open{display:flex}
#lb img,#lb video{max-width:95vw;max-height:90vh;border-radius:8px}
#lb button{position:absolute;background:rgba(255,255,255,.15);border:0;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer}
#lb button:hover{background:rgba(255,255,255,.3)}
#x{top:12px;right:12px}
#pv{left:12px;top:50%;margin-top:-24px}
#nx{right:12px;top:50%;margin-top:-24px}
</style>
</head>
<body>
<header>😂 Смешные картинки</header>
<div class="grid" id="grid"></div>
<div id="st">Загрузка...</div>
<div id="lb"><button id="x">✕</button><button id="pv">‹</button><button id="nx">›</button><div id="box"></div></div>
<script>
const OWNER="fawuna",REPO="mysuperwebsite",DIR="images";
const API="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+DIR;
const VID=/\.(mp4|webm|mov|m4v|ogv)$/i,IMG=/\.(png|jpe?g|gif|webp|avif|bmp)$/i;
const $=s=>document.querySelector(s);
const url=n=>DIR+"/"+encodeURIComponent(n);
const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let files=[],cur=0;

async function getNames(){
try{const c=JSON.parse(sessionStorage.getItem("ls")||"null");if(c&&Date.now()-c.t<120000)return c.d}catch(e){}
const r=await fetch(API);
if(!r.ok)throw new Error(r.status);
const d=(await r.json()).filter(f=>f.type==="file").map(f=>f.name);
try{sessionStorage.setItem("ls",JSON.stringify({t:Date.now(),d}))}catch(e){}
return d;
}

function show(i){
cur=(i+files.length)%files.length;
const n=files[cur],box=$("#box");
box.innerHTML="";
let el;
if(VID.test(n)){el=document.createElement("video");el.controls=true;el.autoplay=true;el.playsInline=true}
else el=document.createElement("img");
el.src=url(n);
box.appendChild(el);
$("#lb").classList.add("open");
}

function close(){
$("#lb").classList.remove("open");
$("#box").innerHTML="";
}

$("#x").onclick=close;
$("#pv").onclick=e=>{e.stopPropagation();show(cur-1)};
$("#nx").onclick=e=>{e.stopPropagation();show(cur+1)};
$("#lb").onclick=e=>{if(e.target.id==="lb")close()};
document.addEventListener("keydown",e=>{
if(!$("#lb").classList.contains("open"))return;
if(e.key==="Escape")close();
else if(e.key==="ArrowRight")show(cur+1);
else if(e.key==="ArrowLeft")show(cur-1);
});

(async()=>{
try{
files=(await getNames()).filter(n=>VID.test(n)||IMG.test(n)).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
if(!files.length){$("#st").textContent="Пока пусто";return}
$("#st").remove();
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.src=en.target.dataset.s;io.unobserve(en.target)}}),{rootMargin:"300px"});
files.forEach((n,i)=>{
const cell=document.createElement("div");
cell.className="cell";
if(VID.test(n)){
const v=document.createElement("video");
v.muted=true;v.preload="metadata";v.playsInline=true;
v.dataset.s=url(n)+"#t=0.5";
const d=document.createElement("span");d.className="dur";
v.addEventListener("loadedmetadata",()=>{d.textContent=fmt(v.duration)});
const p=document.createElement("div");p.className="play";
cell.append(v,p,d);
io.observe(v);
}else{
const im=document.createElement("img");
im.src=url(n);im.loading="lazy";im.alt="";
cell.appendChild(im);
}
cell.onclick=()=>show(i);
$("#grid").appendChild(cell);
});
}catch(e){
$("#st").textContent=String(e.message)==="403"?"Лимит запросов GitHub, подожди немного и обнови страницу.":"Не удалось загрузить файлы. Обнови страницу через минуту.";
}
})();
</script>
</body>
</html>
